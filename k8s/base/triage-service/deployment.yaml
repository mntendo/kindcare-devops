apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: kindcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: triage-service
        version: v1
    spec:
      containers:
        - name: triage-service
          image: 923080620566.dkr.ecr.us-east-1.amazonaws.com/kindcare/triage-service:5ec14737ee15db7035c572d175342edfd8dbc1ab
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: kindcare-db-secret
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: kindcare-db-secret
                  key: name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kindcare-db-secret
                  key: username
            - name: NODE_ENV
              value: "production"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindcare-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
