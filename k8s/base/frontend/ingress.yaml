apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kindcare-ingress
  namespace: kindcare
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - kindcare.mariamdevops.com
      secretName: kindcare-tls
  rules:
    - host: kindcare.mariamdevops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api/triage
            pathType: Prefix
            backend:
              service:
                name: triage-service
                port:
                  number: 3001
          - path: /api/beds
            pathType: Prefix
            backend:
              service:
                name: bed-service
                port:
                  number: 3002
          - path: /api/alerts
            pathType: Prefix
            backend:
              service:
                name: alerts-service
                port:
                  number: 3003
