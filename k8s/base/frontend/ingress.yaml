apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kindcare-ingress
  namespace: kindcare
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /patients
            pathType: Prefix
            backend:
              service:
                name: triage-service
                port:
                  number: 3001
          - path: /beds
            pathType: Prefix
            backend:
              service:
                name: bed-service
                port:
                  number: 3002
          - path: /alerts
            pathType: Prefix
            backend:
              service:
                name: alerts-service
                port:
                  number: 3003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
