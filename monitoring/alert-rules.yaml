apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kindcare-alerts
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: kindcare.rules
      rules:
        - alert: HighCPUUsage
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage is above 80% for 5 minutes"

        - alert: HighMemoryUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High Memory usage on {{ $labels.instance }}"
            description: "Memory usage is above 85% for 5 minutes"

        - alert: LowDiskSpace
          expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Low disk space on {{ $labels.instance }}"
            description: "Disk usage is above 85% for 5 minutes"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="kindcare"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod in kindcare namespace is restarting frequently"
