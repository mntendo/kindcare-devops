apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kindcare
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mntendo/kindcare-devops
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kindcare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
