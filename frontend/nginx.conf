server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pass env vars to frontend at runtime
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
